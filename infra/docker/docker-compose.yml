# AURORA local stack (Phase 1). Run from the repo root:
#   cp .env.example .env
#   docker compose -f infra/docker/docker-compose.yml up -d
# See docs/deployment/deployment-guide.md. (The async `worker` service is added in Phase 5
# when background jobs exist; Postgres/Neo4j/Redis/MinIO are provisioned now for Phase 2+.)

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    depends_on:
      - api

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql+psycopg://aurora:${POSTGRES_PASSWORD:-aurora}@postgres:5432/aurora
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - AI_PROVIDER=${AI_PROVIDER:-mock}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/v1/health'); sys.exit(0)"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aurora
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aurora}
      - POSTGRES_DB=aurora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-aurora}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-aurora} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
  neo4jdata:
  miniodata:
