name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ../../packages/database
          pip install -e ../../packages/ml
          pip install -e ../../packages/graph
          pip install -e ../../packages/simulations
          pip install -e ../../packages/analytics
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  database:
    name: Database (lint + migrations + tests on Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/database
    env:
      # SQLAlchemy 2.0 + psycopg 3 DSN for the Postgres service below.
      AURORA_PG_URL: postgresql+psycopg://aurora:aurora@localhost:5432/aurora
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrate (alembic upgrade head on Postgres)
        run: alembic -x url="$AURORA_PG_URL" upgrade head
      - name: Seed + verify Nimbus at full scale (Postgres)
        run: python -m aurora_db.seed --demo nimbus --verify --url "$AURORA_PG_URL" --scale 1.0
      - name: Test (pytest against Postgres)
        env:
          AURORA_TEST_DB_URL: ${{ env.AURORA_PG_URL }}
        run: pytest

  ml:
    name: ML (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ../database
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  graph:
    name: Graph (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ../database
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  simulations:
    name: Simulations (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/simulations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  analytics:
    name: Analytics (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ../database
          pip install -e ../ml
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @aurora/web lint
      - name: Typecheck
        run: pnpm --filter @aurora/web typecheck
      - name: Build
        run: pnpm --filter @aurora/web build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install web deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm --filter @aurora/web test:e2e:install
      - name: Run E2E suite (boots API + web via playwright webServer)
        run: pnpm --filter @aurora/web test:e2e
        env:
          CI: "true"
          DEMO_SEED_SCALE: "0.05"
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
