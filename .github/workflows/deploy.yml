# Build API + web images, push to ECR, and force ECS redeployment.
# Does NOT run Terraform or Alembic migrations — see docs/DEPLOY-CHECKLIST.md.
#
# Required repository secrets:
#   AWS_ROLE_ARN  — IAM role ARN trusted by GitHub OIDC for ECR + ECS
#   AWS_REGION    — optional; defaults to us-east-1
#
# Required GitHub environments: staging, production (match workflow_dispatch input)
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Docker image tag to deploy
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: aurora

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build -f infra/docker/api.Dockerfile -t $ECR_REGISTRY/${{ env.PROJECT_NAME }}-api:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.PROJECT_NAME }}-api:$IMAGE_TAG

      - name: Build and push web image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build -f infra/docker/web.Dockerfile -t $ECR_REGISTRY/${{ env.PROJECT_NAME }}-web:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.PROJECT_NAME }}-web:$IMAGE_TAG

      - name: Force ECS service redeployment
        env:
          CLUSTER: ${{ env.PROJECT_NAME }}-${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          for SERVICE in api web; do
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-${SERVICE}" \
              --force-new-deployment \
              --no-cli-pager
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-${SERVICE}" \
              || echo "Warning: ${SERVICE} did not reach stable within wait timeout"
          done
          echo "Deployed tag ${IMAGE_TAG} to ${CLUSTER}"

      - name: Deployment summary
        run: |
          echo "## Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster: ${{ env.PROJECT_NAME }}-${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Post-deploy" >> $GITHUB_STEP_SUMMARY
          echo "1. Run Alembic migrations if schema changed (\`docs/DEPLOY-CHECKLIST.md\` Step 4)." >> $GITHUB_STEP_SUMMARY
          echo "2. Smoke test: \`BASE_URL=https://<alb>/api/v1 ./scripts/load-test.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Preflight locally: \`./scripts/deploy-check.sh\`" >> $GITHUB_STEP_SUMMARY
