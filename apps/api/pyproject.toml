[project]
name = "aurora-api"
version = "0.1.0"
description = "AURORA — Enterprise Decision Intelligence OS (backend API)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Note: "UP" (pyupgrade) is intentionally omitted. The package supports Python 3.9
# (requires-python >=3.9) and pydantic evaluates annotations at runtime, where PEP 604
# unions (X | None) fail on 3.9. We therefore keep typing.Optional/List deliberately.
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in argument defaults
