[project]
name = "aurora-graph"
version = "0.1.0"
description = "AURORA — Knowledge graph projection, sync, and traversal queries"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
