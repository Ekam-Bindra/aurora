[project]
name = "aurora-analytics"
version = "0.1.0"
description = "AURORA analytics mart backends (Postgres/DuckDB default, optional ClickHouse)"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
clickhouse = [
    "clickhouse-connect>=0.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
