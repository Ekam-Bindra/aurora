# Alembic configuration for aurora_db.
# The database URL is resolved at runtime in env.py from (in priority order):
#   1. `alembic -x url=<URL> ...`
#   2. $DATABASE_URL  or  $AURORA_DATABASE_URL
#   3. a local sqlite fallback (sqlite:///./aurora_local.db)

[alembic]
script_location = aurora_db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
